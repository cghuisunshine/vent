<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Weekly Schedule — FSWD 4 A</title>
    <style>
      :root {
        --page-bg: #ffffff;
        --text: #111827;
        --muted: #6b7280;
        --line: #e5e7eb;
        --panel: #f3f4f6;
        --panel-2: #f9fafb;
        --accent: #a35722;

        --time-col: 84px;
        --day-col-min: 170px;
        --day-header-h: 34px;
        --ppm: 1.75; /* pixels per minute */
        --halfHour: 53px; /* set precisely via JS */
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--page-bg);
        color: var(--text);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.3;
      }

      a {
        color: var(--accent);
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      .wrap {
        max-width: 1420px;
        margin: 18px auto 36px;
        padding: 0 14px;
      }

      .topbar {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: end;
        gap: 12px;
        padding: 10px 6px 14px;
        border-bottom: 1px solid var(--line);
      }

      .block {
        font-weight: 650;
        letter-spacing: 0.01em;
      }

      .navLeft,
      .navRight {
        font-size: 0.95rem;
      }

      .navRight {
        text-align: right;
      }

      .weekTitle {
        text-align: center;
        font-size: 1.35rem;
        font-weight: 650;
        letter-spacing: 0.01em;
      }

      .weekMeta {
        font-weight: 600;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .calendarShell {
        margin-top: 12px;
        overflow: auto;
        border: 1px solid var(--line);
        background: #fff;
        -webkit-overflow-scrolling: touch;
      }

      .calendar {
        min-width: calc(var(--time-col) + var(--day-col-min) * 7);
      }

      .daysRow {
        display: grid;
        grid-template-columns: var(--time-col) repeat(7, 1fr);
        align-items: stretch;
        position: sticky;
        top: 0;
        z-index: 5;
        border-bottom: 1px solid var(--line);
        background: var(--panel-2);
      }

      .daysRow .spacer {
        height: var(--day-header-h);
        border-right: 1px solid var(--line);
        position: sticky;
        left: 0;
        z-index: 6;
        background: var(--panel-2);
      }

      .dayHead {
        height: var(--day-header-h);
        display: flex;
        align-items: center;
        padding: 0 10px;
        font-weight: 650;
        border-right: 1px solid var(--line);
        background: var(--panel-2);
      }

      .dayHead:last-child {
        border-right: none;
      }

      .gridRow {
        display: grid;
        grid-template-columns: var(--time-col) repeat(7, 1fr);
        align-items: stretch;
      }

      .timeCol {
        position: sticky;
        left: 0;
        z-index: 4;
        border-right: 1px solid var(--line);
        background: #fff;
      }

      .timeLabel {
        position: absolute;
        left: 10px;
        transform: translateY(-50%);
        font-weight: 650;
        color: #111827;
        font-size: 0.95rem;
        white-space: nowrap;
      }

      .dayCol {
        position: relative;
        border-right: 1px solid var(--line);
        background:
          repeating-linear-gradient(
            to bottom,
            transparent 0,
            transparent calc(var(--halfHour) - 1px),
            rgba(17, 24, 39, 0.08) calc(var(--halfHour) - 1px),
            rgba(17, 24, 39, 0.08) var(--halfHour)
          );
      }

      .dayCol:nth-child(2n) {
        background:
          repeating-linear-gradient(
            to bottom,
            rgba(0, 0, 0, 0.015) 0,
            rgba(0, 0, 0, 0.015) calc(var(--halfHour) - 1px),
            rgba(17, 24, 39, 0.08) calc(var(--halfHour) - 1px),
            rgba(17, 24, 39, 0.08) var(--halfHour)
          );
      }

      .dayCol:last-child {
        border-right: none;
      }

      .dayCol.today::before {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(163, 87, 34, 0.08);
        pointer-events: none;
      }

      .dayHead.today {
        background: rgba(163, 87, 34, 0.12);
        color: #7c2d12;
      }

      .event {
        position: absolute;
        left: 10px;
        right: 10px;
        z-index: 1;
        background: rgba(17, 24, 39, 0.06);
        border-radius: 6px;
        padding: 8px 58px 8px 10px;
        color: var(--accent);
        overflow: auto;
      }

      .event .code {
        font-weight: 800;
        letter-spacing: 0.01em;
      }

      .event .title {
        font-weight: 750;
      }

      .event .detail {
        font-weight: 650;
      }

      .event .detail,
      .event .room {
        font-size: 0.95rem;
      }

      .event .note {
        margin-top: 6px;
        padding-top: 6px;
        border-top: 1px solid rgba(163, 87, 34, 0.2);
        font-size: 0.9rem;
        font-weight: 700;
        color: #7c2d12;
      }

      .noteButton {
        position: absolute;
        top: 8px;
        right: 8px;
        border: 1px solid rgba(163, 87, 34, 0.35);
        border-radius: 999px;
        padding: 3px 8px;
        background: rgba(255, 255, 255, 0.9);
        color: #7c2d12;
        font: inherit;
        font-size: 0.72rem;
        font-weight: 800;
        cursor: pointer;
      }

      .noteButton.hasNote {
        background: #fef3c7;
      }

      .noteButton:hover {
        background: #fff7ed;
      }

      .dayNote {
        position: absolute;
        top: 12px;
        left: 10px;
        right: 10px;
        z-index: 1;
        border: 1px dashed #d1d5db;
        border-radius: 8px;
        padding: 10px 12px;
        background: #fffbeb;
        color: #92400e;
      }

      .dayNote .label {
        font-weight: 800;
        letter-spacing: 0.01em;
      }

      .dayNote .subtext {
        margin-top: 2px;
        font-size: 0.92rem;
        font-weight: 600;
      }

      dialog.noteDialog {
        width: min(520px, calc(100vw - 24px));
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 0;
        box-shadow: 0 18px 48px rgba(17, 24, 39, 0.22);
      }

      dialog.noteDialog::backdrop {
        background: rgba(17, 24, 39, 0.42);
      }

      .noteDialogForm {
        display: grid;
        gap: 12px;
        padding: 18px;
      }

      .noteDialogTitle {
        margin: 0;
        font-size: 1.1rem;
      }

      .noteDialogMeta {
        color: var(--muted);
        font-size: 0.95rem;
      }

      .noteTextarea {
        min-height: 140px;
        width: 100%;
        resize: vertical;
        border: 1px solid #d1d5db;
        border-radius: 10px;
        padding: 10px 12px;
        font: inherit;
        line-height: 1.4;
      }

      .noteHint {
        color: var(--muted);
        font-size: 0.85rem;
      }

      .noteDialogActions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
      }

      .noteDialogActions button {
        border: 1px solid #d1d5db;
        border-radius: 8px;
        padding: 8px 12px;
        background: #fff;
        color: var(--text);
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      .noteDialogActions .primary {
        border-color: #92400e;
        background: #92400e;
        color: #fff;
      }

      @media print {
        .wrap {
          max-width: none;
          margin: 0;
          padding: 0;
        }

        .calendarShell {
          border: none;
          overflow: visible;
        }

        .topbar a {
          display: none;
        }
      }

      @media (max-width: 860px) {
        :root {
          --time-col: 66px;
          --day-col-min: 132px;
        }

        .wrap {
          margin: 10px auto 22px;
        }

        .topbar {
          grid-template-columns: 1fr;
          align-items: start;
        }

        .navLeft,
        .navRight {
          display: none;
        }

        .block,
        .weekTitle {
          text-align: center;
        }

        .weekTitle {
          font-size: 1.15rem;
        }

        .calendarShell {
          max-height: calc(100vh - 120px);
        }

        .event {
          left: 6px;
          right: 6px;
          padding: 6px 52px 6px 8px;
        }

        .event .detail,
        .event .room {
          font-size: 0.85rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header class="topbar" aria-label="Schedule header">
        <div>
          <div class="block">Block: FSWD 4 A - 7540 Full-Stack Web Dev</div>
          <div class="navLeft"><a id="prevWeekLink" href="#" aria-label="Previous week">Previous Week</a></div>
        </div>
        <div class="weekTitle" id="weekTitle"></div>
        <div class="navRight"><a id="nextWeekLink" href="#" aria-label="Next week">Next Week</a></div>
      </header>

      <main class="calendarShell" aria-label="Weekly schedule">
        <div class="calendar">
          <div class="daysRow" aria-hidden="true">
            <div class="spacer"></div>
            <div class="dayHead">Monday</div>
            <div class="dayHead">Tuesday</div>
            <div class="dayHead">Wednesday</div>
            <div class="dayHead">Thursday</div>
            <div class="dayHead">Friday</div>
            <div class="dayHead">Saturday</div>
            <div class="dayHead">Sunday</div>
          </div>

          <div class="gridRow" id="gridRow">
            <div class="timeCol" id="timeCol" aria-hidden="true"></div>
            <div class="dayCol" data-day="mon"></div>
            <div class="dayCol" data-day="tue"></div>
            <div class="dayCol" data-day="wed"></div>
            <div class="dayCol" data-day="thu"></div>
            <div class="dayCol" data-day="fri"></div>
            <div class="dayCol" data-day="sat"></div>
            <div class="dayCol" data-day="sun"></div>
          </div>
        </div>
      </main>
    </div>

    <dialog class="noteDialog" id="noteDialog">
      <form class="noteDialogForm" id="noteDialogForm" method="dialog">
        <h2 class="noteDialogTitle">Course Notes</h2>
        <div class="noteDialogMeta" id="noteDialogMeta"></div>
        <textarea
          class="noteTextarea"
          id="noteTextarea"
          placeholder="Add one note per line"
        ></textarea>
        <div class="noteHint">Notes are stored in this browser using localStorage.</div>
        <div class="noteDialogActions">
          <button type="button" id="clearNoteButton">Clear</button>
          <button type="button" id="cancelNoteButton">Cancel</button>
          <button class="primary" type="submit">Save</button>
        </div>
      </form>
    </dialog>

    <script>
      const scheduleConfig = {
        start: "10:00",
        end: "17:20",
        pixelsPerMinute: 1.75,
      };

      const recurringEvents = [
        {
          id: "mdia-2025-mon",
          day: "mon",
          start: "13:30",
          end: "16:20",
          lines: [
            { cls: "code", text: "MDIA 2025" },
            { cls: "title", text: "Digital Portfolio Development" },
            { cls: "detail", text: "CRN 90170 Lecture/Lab" },
            { cls: "detail", text: "Combo" },
            { cls: "detail", text: "1330-1620" },
            { cls: "room", text: "DTC 890" },
          ],
        },
        {
          id: "idsp-4380-tue-1130",
          day: "tue",
          start: "11:30",
          end: "12:20",
          lines: [
            { cls: "code", text: "IDSP 4380" },
            { cls: "title", text: "Web Projects 3" },
            { cls: "detail", text: "CRN 88033 Lecture/Lab" },
            { cls: "detail", text: "Combo" },
            { cls: "detail", text: "1130-1220" },
            { cls: "room", text: "DTC 557" },
          ],
        },
        {
          id: "comp-4515-tue-1330",
          day: "tue",
          start: "13:30",
          end: "17:20",
          lines: [
            { cls: "code", text: "COMP 4515" },
            { cls: "title", text: "Server-Side Web Scripting/PHP" },
            { cls: "detail", text: "CRN 88032 Seminar" },
            { cls: "detail", text: "1330-1720" },
            { cls: "room", text: "DTC 557" },
          ],
        },
        {
          id: "vent-4000-wed",
          day: "wed",
          start: "11:30",
          end: "14:20",
          lines: [
            { cls: "code", text: "VENT 4000" },
            { cls: "title", text: "Entrepreneurship" },
            { cls: "detail", text: "CRN 88035 Lecture/Lab" },
            { cls: "detail", text: "Combo" },
            { cls: "detail", text: "1130-1420" },
            { cls: "room", text: "DTC 557" },
          ],
        },
        {
          id: "acit-4770-thu",
          day: "thu",
          start: "10:30",
          end: "12:20",
          lines: [
            { cls: "code", text: "ACIT 4770" },
            { cls: "title", text: "Legal and Ethical Issues in IT" },
            { cls: "detail", text: "CRN 88030 Lab" },
            { cls: "detail", text: "1030-1220" },
            { cls: "room", text: "DTC 557" },
          ],
        },
        {
          id: "comp-4513-thu",
          day: "thu",
          start: "13:30",
          end: "17:20",
          lines: [
            { cls: "code", text: "COMP 4513" },
            { cls: "title", text: "C# and ASP.NET for Web Devs" },
            { cls: "detail", text: "CRN 93016 Lecture/Lab" },
            { cls: "detail", text: "Combo" },
            { cls: "detail", text: "1330-1720" },
            { cls: "room", text: "DTC 557" },
          ],
        },
        {
          id: "idsp-4380-fri",
          day: "fri",
          start: "12:30",
          end: "17:20",
          lines: [
            { cls: "code", text: "IDSP 4380" },
            { cls: "title", text: "Web Projects 3" },
            { cls: "detail", text: "CRN 88033 Lecture/Lab" },
            { cls: "detail", text: "Combo" },
            { cls: "detail", text: "1230-1720" },
            { cls: "room", text: "DTC 557" },
          ],
        },
      ];

      const dayKeys = ["mon", "tue", "wed", "thu", "fri", "sat", "sun"];
      const dayIndexByKey = Object.fromEntries(dayKeys.map((key, index) => [key, index]));
      const noClassDates = {
        "2026-04-06": true,
      };
      const eventExceptionsByDate = {
        "2026-04-21": {
          suppressEventIds: ["idsp-4380-tue-1130"],
        },
      };
      const eventNotesByDate = {
        // Example:
        // "2026-04-23": {
        //   "comp-4513-thu": ["Bring project draft", "Lab starts at 14:00"],
        // },
      };
      const eventNoteStorageKey = "weekSchedule.eventNotes.v1";
      let storedEventNotes = loadStoredEventNotes();
      let activeNoteTarget = null;

      function parseIsoDateLocal(value) {
        if (!/^\d{4}-\d{2}-\d{2}$/.test(value)) return null;
        const [year, month, day] = value.split("-").map(Number);
        const date = new Date(year, month - 1, day);
        return Number.isNaN(date.getTime()) ? null : date;
      }

      function addDays(date, days) {
        return new Date(date.getFullYear(), date.getMonth(), date.getDate() + days);
      }

      function startOfWeekMonday(date) {
        const day = date.getDay();
        const diff = day === 0 ? -6 : 1 - day;
        return addDays(date, diff);
      }

      function toIsoDateLocal(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
      }

      function formatWeekOf(date) {
        return new Intl.DateTimeFormat("en-CA", {
          month: "short",
          day: "2-digit",
          year: "numeric",
        }).format(date);
      }

      function formatFullDate(date) {
        return new Intl.DateTimeFormat("en-CA", {
          weekday: "long",
          month: "short",
          day: "2-digit",
        }).format(date);
      }

      function normalizeNotes(value) {
        const list = Array.isArray(value) ? value : value ? [value] : [];
        return list.map((item) => String(item).trim()).filter(Boolean);
      }

      function loadStoredEventNotes() {
        try {
          const raw = window.localStorage.getItem(eventNoteStorageKey);
          if (!raw) return {};
          const parsed = JSON.parse(raw);
          return parsed && typeof parsed === "object" ? parsed : {};
        } catch {
          return {};
        }
      }

      function saveStoredEventNotes() {
        window.localStorage.setItem(eventNoteStorageKey, JSON.stringify(storedEventNotes));
      }

      function getUserNotes(dateKey, eventId) {
        return normalizeNotes(storedEventNotes[dateKey]?.[eventId]);
      }

      function getEventNotes(dateKey, eventId) {
        return [
          ...normalizeNotes(eventNotesByDate[dateKey]?.[eventId]),
          ...getUserNotes(dateKey, eventId),
        ];
      }

      function setUserNotes(dateKey, eventId, notes) {
        const normalized = normalizeNotes(notes);
        const nextStoredNotes = { ...storedEventNotes };
        const nextDateNotes = { ...(nextStoredNotes[dateKey] || {}) };

        if (normalized.length) {
          nextDateNotes[eventId] = normalized;
          nextStoredNotes[dateKey] = nextDateNotes;
        } else {
          delete nextDateNotes[eventId];
          if (Object.keys(nextDateNotes).length) nextStoredNotes[dateKey] = nextDateNotes;
          else delete nextStoredNotes[dateKey];
        }

        storedEventNotes = nextStoredNotes;
        saveStoredEventNotes();
      }

      function getEventTitle(event) {
        const titleLine = event.lines.find((line) => line.cls === "title")?.text;
        const codeLine = event.lines.find((line) => line.cls === "code")?.text;
        return [codeLine, titleLine].filter(Boolean).join(" - ");
      }

      function openNoteDialogForEvent(event) {
        const dialog = document.getElementById("noteDialog");
        const meta = document.getElementById("noteDialogMeta");
        const textarea = document.getElementById("noteTextarea");

        activeNoteTarget = {
          dateKey: event.dateKey,
          eventId: event.id,
        };
        meta.textContent = `${event.dateKey} • ${getEventTitle(event)}`;
        textarea.value = getUserNotes(event.dateKey, event.id).join("\n");
        dialog.showModal();
        textarea.focus();
      }

      function closeNoteDialog() {
        const dialog = document.getElementById("noteDialog");
        if (dialog.open) dialog.close();
        activeNoteTarget = null;
      }

      function setupNoteDialog() {
        const form = document.getElementById("noteDialogForm");
        const dialog = document.getElementById("noteDialog");
        const clearButton = document.getElementById("clearNoteButton");
        const cancelButton = document.getElementById("cancelNoteButton");
        const textarea = document.getElementById("noteTextarea");

        form.addEventListener("submit", (event) => {
          event.preventDefault();
          if (!activeNoteTarget) return;

          setUserNotes(activeNoteTarget.dateKey, activeNoteTarget.eventId, textarea.value.split("\n"));
          closeNoteDialog();
          renderAll();
        });

        clearButton.addEventListener("click", () => {
          if (!activeNoteTarget) return;
          setUserNotes(activeNoteTarget.dateKey, activeNoteTarget.eventId, []);
          closeNoteDialog();
          renderAll();
        });

        cancelButton.addEventListener("click", () => {
          closeNoteDialog();
        });

        dialog.addEventListener("close", () => {
          activeNoteTarget = null;
        });
      }

      function getSelectedWeekStart() {
        const params = new URLSearchParams(window.location.search);
        const weekParam = params.get("week");
        const parsed = weekParam ? parseIsoDateLocal(weekParam) : null;
        return startOfWeekMonday(parsed || new Date());
      }

      function setWeekNavigation(weekStart) {
        const title = document.getElementById("weekTitle");
        title.textContent = `Week of ${formatWeekOf(weekStart)}`;

        const currentUrl = new URL(window.location.href);
        const prevWeek = addDays(weekStart, -7);
        const nextWeek = addDays(weekStart, 7);

        const prevUrl = new URL(currentUrl);
        prevUrl.searchParams.set("week", toIsoDateLocal(prevWeek));
        document.getElementById("prevWeekLink").href = prevUrl.toString();

        const nextUrl = new URL(currentUrl);
        nextUrl.searchParams.set("week", toIsoDateLocal(nextWeek));
        document.getElementById("nextWeekLink").href = nextUrl.toString();
      }

      function getDayNotes(weekStart) {
        const notes = {};

        for (const [dateKey, note] of Object.entries(noClassDates)) {
          const exceptionDate = parseIsoDateLocal(dateKey);
          if (!exceptionDate) continue;
          if (!note || typeof note !== "object" || !note.label) continue;

          const diffDays = Math.round((exceptionDate - weekStart) / 86400000);
          if (diffDays < 0 || diffDays >= dayKeys.length) continue;

          const day = dayKeys[diffDays];
          notes[day] = {
            ...note,
            subtext: formatFullDate(exceptionDate),
          };
        }

        for (const [dateKey, exception] of Object.entries(eventExceptionsByDate)) {
          const exceptionDate = parseIsoDateLocal(dateKey);
          if (!exceptionDate) continue;
          if (!exception?.label) continue;

          const diffDays = Math.round((exceptionDate - weekStart) / 86400000);
          if (diffDays < 0 || diffDays >= dayKeys.length) continue;

          const day = dayKeys[diffDays];
          notes[day] = {
            label: exception.label,
            subtext: formatFullDate(exceptionDate),
          };
        }

        return notes;
      }

      function getEventsForWeek(weekStart) {
        return recurringEvents.flatMap((event) => {
          const dayOffset = dayIndexByKey[event.day];
          if (dayOffset == null) return [];

          const eventDate = addDays(weekStart, dayOffset);
          const eventDateKey = toIsoDateLocal(eventDate);
          if (noClassDates[eventDateKey]) return [];

          const dateException = eventExceptionsByDate[eventDateKey];
          if (dateException?.suppressEventIds?.includes(event.id)) return [];

          const notes = getEventNotes(eventDateKey, event.id);

          return [
            {
              ...event,
              dateKey: eventDateKey,
              notes,
            },
          ];
        });
      }

      function parseTimeToMinutes(time) {
        const [hh, mm] = time.split(":").map(Number);
        return hh * 60 + mm;
      }

      function formatHourLabel(minutes) {
        const hh = Math.floor(minutes / 60);
        return `${String(hh).padStart(2, "0")}00`;
      }

      function setGridSizing() {
        const startMin = parseTimeToMinutes(scheduleConfig.start);
        const endMin = parseTimeToMinutes(scheduleConfig.end);
        const duration = endMin - startMin;
        const ppm = scheduleConfig.pixelsPerMinute;
        const gridHeightPx = Math.max(1, Math.round(duration * ppm));

        document.documentElement.style.setProperty("--halfHour", `${Math.round(30 * ppm)}px`);
        const gridRow = document.getElementById("gridRow");
        gridRow.style.height = `${gridHeightPx}px`;

        const dayCols = Array.from(document.querySelectorAll(".dayCol"));
        for (const col of dayCols) col.style.height = `${gridHeightPx}px`;
        document.getElementById("timeCol").style.height = `${gridHeightPx}px`;
      }

      function renderTimeLabels() {
        const startMin = parseTimeToMinutes(scheduleConfig.start);
        const endMin = parseTimeToMinutes(scheduleConfig.end);
        const ppm = scheduleConfig.pixelsPerMinute;
        const gridHeight = Math.max(1, Math.round((endMin - startMin) * ppm));

        const timeCol = document.getElementById("timeCol");
        timeCol.replaceChildren();

        for (let t = startMin; t <= endMin; t += 60) {
          const label = document.createElement("div");
          label.className = "timeLabel";
          label.textContent = formatHourLabel(t);
          const top = Math.round((t - startMin) * ppm);
          label.style.top = `${Math.min(gridHeight, Math.max(0, top))}px`;
          label.style.transform =
            t === startMin ? "translateY(0)" : t === endMin ? "translateY(-100%)" : "translateY(-50%)";
          timeCol.appendChild(label);
        }
      }

      function renderEvents(events, dayNotes) {
        const startMin = parseTimeToMinutes(scheduleConfig.start);
        const ppm = scheduleConfig.pixelsPerMinute;

        const dayCols = new Map(
          Array.from(document.querySelectorAll(".dayCol")).map((el) => [el.dataset.day, el]),
        );
        for (const col of dayCols.values()) col.replaceChildren();

        for (const [day, note] of Object.entries(dayNotes)) {
          const col = dayCols.get(day);
          if (!col) continue;

          const noteEl = document.createElement("div");
          noteEl.className = "dayNote";

          const label = document.createElement("div");
          label.className = "label";
          label.textContent = note.label;
          noteEl.appendChild(label);

          if (note.subtext) {
            const subtext = document.createElement("div");
            subtext.className = "subtext";
            subtext.textContent = note.subtext;
            noteEl.appendChild(subtext);
          }

          col.appendChild(noteEl);
        }

        for (const event of events) {
          const col = dayCols.get(event.day);
          if (!col) continue;

          const ev = document.createElement("div");
          ev.className = "event";

          const evStart = parseTimeToMinutes(event.start);
          const evEnd = parseTimeToMinutes(event.end);
          const top = Math.round((evStart - startMin) * ppm);
          const height = Math.max(16, Math.round((evEnd - evStart) * ppm));

          ev.style.top = `${top}px`;
          ev.style.height = `${height}px`;

          const noteButton = document.createElement("button");
          noteButton.type = "button";
          noteButton.className = `noteButton${event.notes?.length ? " hasNote" : ""}`;
          noteButton.textContent = event.notes?.length ? "Edit Note" : "Add Note";
          noteButton.addEventListener("click", () => openNoteDialogForEvent(event));
          ev.appendChild(noteButton);

          for (const line of event.lines) {
            const div = document.createElement("div");
            div.className = line.cls;
            div.textContent = line.text;
            ev.appendChild(div);
          }

          for (const note of event.notes || []) {
            const div = document.createElement("div");
            div.className = "note";
            div.textContent = note;
            ev.appendChild(div);
          }

          col.appendChild(ev);
        }
      }

      function choosePixelsPerMinute() {
        return window.matchMedia("(max-width: 860px)").matches ? 1.35 : 1.75;
      }

      function debounce(fn, waitMs) {
        let t;
        return (...args) => {
          window.clearTimeout(t);
          t = window.setTimeout(() => fn(...args), waitMs);
        };
      }

      function renderAll() {
        const weekStart = getSelectedWeekStart();
        const dayNotes = getDayNotes(weekStart);
        const events = getEventsForWeek(weekStart);

        setWeekNavigation(weekStart);
        scheduleConfig.pixelsPerMinute = choosePixelsPerMinute();
        setGridSizing();
        renderTimeLabels();
        renderEvents(events, dayNotes);
      }

      setupNoteDialog();
      renderAll();
      window.addEventListener("resize", debounce(renderAll, 150), { passive: true });

      (function highlightToday() {
        const today = new Date();
        const selectedWeekStart = getSelectedWeekStart();
        const currentWeekStart = startOfWeekMonday(today);
        if (toIsoDateLocal(selectedWeekStart) !== toIsoDateLocal(currentWeekStart)) return;

        const keyByDayIndex = ["sun", "mon", "tue", "wed", "thu", "fri", "sat"];
        const todayKey = keyByDayIndex[today.getDay()];

        const col = document.querySelector(`.dayCol[data-day="${todayKey}"]`);
        if (col) col.classList.add("today");

        const headOrder = ["mon", "tue", "wed", "thu", "fri", "sat", "sun"];
        const headIndex = headOrder.indexOf(todayKey);
        const heads = document.querySelectorAll(".dayHead");
        if (headIndex >= 0 && heads[headIndex]) heads[headIndex].classList.add("today");
      })();
    </script>
  </body>
</html>
